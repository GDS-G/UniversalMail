services:
  universalmail:
    build: .
    environment:
      UNIVERSALMAIL_MASTER_KEY: ${UNIVERSALMAIL_MASTER_KEY:?Set a Fernet master key}
      UNIVERSALMAIL_API_KEY: ${UNIVERSALMAIL_API_KEY:?Set a strong API key}
      UNIVERSALMAIL_DB_PATH: /app/data/accounts.db
      UNIVERSALMAIL_PUBLIC_URL: ${UNIVERSALMAIL_PUBLIC_URL:?Set the public origin}
      UNIVERSALMAIL_ALLOW_INSECURE_LOCALHOST: ${UNIVERSALMAIL_ALLOW_INSECURE_LOCALHOST:-false}
      UNIVERSALMAIL_ALLOW_PRIVATE_MAIL_HOSTS: ${UNIVERSALMAIL_ALLOW_PRIVATE_MAIL_HOSTS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - universalmail_data:/app/data
    restart: unless-stopped
volumes:
  universalmail_data:
